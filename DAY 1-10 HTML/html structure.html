<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists & Formatting Tutorial</title>
</head>
<body>
   <h1>HTML Tables</h1>
   <h2>Simple HTML Table</h2>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Age</th>
      <th>Country</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Alice</td>
      <td>30</td>
      <td>USA</td>
    </tr>
    <tr>
      <td>Bob</td>
      <td>25</td>
      <td>Canada</td>
    </tr>
    <tr>
      <td>Charlie</td>
      <td>35</td>
      <td>UK</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
        <td colspan="3">End of table data</td>
    </tr>
  </tfoot>
</table>
</body>
</html>
